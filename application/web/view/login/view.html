<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>培训中心</title>
</head>
<body>
<form id="loginForm">
    <!--    <label for="username">账号:</label>-->
    <input type="hidden" id="username" name="username" value="{$account}" required><br>

    <!--    <label for="password">密码:</label>-->
    <input type="hidden" id="password" name="password" value="{$pwd}" required><br>
</form>

<div id="message"></div>

<script>
    // 页面加载完成后，自动发起 AJAX 登录请求
    window.onload = function() {
        // 获取表单字段的值
        var username = document.getElementById('username').value;
        var password = document.getElementById('password').value;



        // 创建 XMLHttpRequest 对象
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '{$edu_login_url}', false);

        // 允许携带 cookie
        xhr.withCredentials = true;
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

        // 定义处理响应的回调函数
        xhr.onreadystatechange = function() {
            if (xhr.readyState === XMLHttpRequest.DONE)
                if (xhr.status === 200) {
                    // 解析服务器返回的数据
					console.log('xhr========>', xhr);
                    var response = JSON.parse(xhr.responseText);

                    if (response.code == 200) {

                        // document.cookie = "account="+username+";pwd="+password+";expires=;path=/";

                        // 登录成功，显示成功消息并跳转
                        document.getElementById('message').innerHTML = '正在进入...';

                        // 跳转到指定地址，并携带登录时的 cookie
                        setTimeout(function() {
                            window.location.href = '{$edu_location_url}';
                            // top.location.href = '{$edu_location_url}';
                        }, 500);
                    } else {

                        //不强制登录, 没登录成功也跳转
                        setTimeout(function() {
                            window.location.href = '{$edu_location_url}';
                            // top.location.href = '{$edu_location_url}';
                        }, 500);

                        // 登录失败，显示错误消息
                        // document.getElementById('message').innerHTML = '登录失败: ' + response.msg;
                    }
                } else {
                    console.log(xhr.status)
                    // 处理请求失败的情况
                    document.getElementById('message').innerHTML = '出错了: 请求失败, 请稍后重试';
                }
        }

        // 发送 AJAX 请求
        var params = 'account=' + encodeURIComponent(username) + '&pwd=' + encodeURIComponent(password);
        xhr.send(params);
    }
</script>
</body>
</html>
