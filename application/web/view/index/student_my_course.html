{extend name="public/container"}
{block name="title"}我的课程{/block}
{block name="app"}
<div v-cloak id="app" class="home">
    <div class="main">
		<div v-for="item in contentRecommend" :key="item.id">
			<div v-if="item.show_count <= 2" >
				<class2 :recommend="item" :article-list="articleList" :rank-list="rankList" :good-list="goodList" :new-list="newList"></class2>
			</div>
			<div v-else>
				<class4 :recommend="item" :article-list="articleList" :rank-list="rankList" :good-list="goodList" :new-list="newList"></class4>
			</div>
		</div>
    </div>
</div>
{/block}
{block name="vm"}
<script>
    require([
        'vue',
        'ELEMENT',
        'components/home/class2/index',
        'components/home/class4/index',
        'swiper',
        'api/home',
        'mixins/base',
        'router/index',
    ], function (
        Vue,
        ELEMENT,
		class2,
		class4,
        Swiper,
        homeApi,
        baseMixin,
        router
    ) {
        Vue.use(ELEMENT);
        Vue.use(router);
        var vm = new Vue({
            el: '#app',
            components: {
                'class2': class2,
                'class4': class4,
            },
            mixins: [baseMixin],
            data: {
                bannerList: [],
                advertList: [],
                advert: '',
                advertLink: '',
                contentRecommend: [],
                rankList: [],
                newList: [],
                articleList: [],
                articleNewList: [],
                goodList: [],
                automatic_recommend: '',
                news_recommend: ''
            },
            created: function () {
                this.get_content_recommend();
            },
            methods: {
                get_content_recommend: function () {
                    homeApi.get_content_recommend().then(function (res) {
                        var recommend = res.data.recommend;
                        recommend.forEach(function (item) {
                            if (item.type == 4) {
                                vm.getArticleList({
                                    type: 2,
                                    limit: 9
                                });
                            } else if (item.type == 5) {
                                vm.getCourseRanking();
                                vm.getNewCourseFirst();
                                vm.get_good_class_recommend();
                            }
                        });
                        vm.contentRecommend = res.data.recommend;
                    }).catch(function (err) {
                        vm.$message.error(err.msg);
                    });
                },
            }
        });
    });
</script>
{/block}
